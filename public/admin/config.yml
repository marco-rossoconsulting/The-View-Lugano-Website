# Sveltia CMS configuration — THE VIEW Lugano
# Backend: GitHub with Personal Access Token auth
backend:
  name: github
  repo: marco-rossoconsulting/The-View-Lugano-Website
  branch: main
  auth_methods: [token]

media_folder: src/assets/photos
public_folder: /src/assets/photos

site_url: https://theview-lugano.netlify.app
display_url: https://theview-lugano.netlify.app
locale: en

# ── Reusable field templates ──
localize: &loc
  - { name: en, label: English, widget: string }
  - { name: de, label: Deutsch, widget: string }
  - { name: it, label: Italiano, widget: string }
  - { name: fr, label: Français, widget: string }

localize_text: &loctext
  - { name: en, label: English, widget: text }
  - { name: de, label: Deutsch, widget: text }
  - { name: it, label: Italiano, widget: text }
  - { name: fr, label: Français, widget: text }

localize_paragraphs: &locpars
  - { name: en, label: English, widget: list, field: { name: p, label: Paragraph, widget: text } }
  - { name: de, label: Deutsch, widget: list, field: { name: p, label: Paragraph, widget: text } }
  - { name: it, label: Italiano, widget: list, field: { name: p, label: Paragraph, widget: text } }
  - { name: fr, label: Français, widget: list, field: { name: p, label: Paragraph, widget: text } }

collections:
  # ── 1. SETTINGS ──
  - name: settings
    label: ⚙️ Site Settings
    files:
      - name: settings
        label: Settings
        file: src/content/settings/settings.json
        fields:
          - name: nav
            label: Navigation Labels
            widget: object
            fields:
              - { name: home, label: Home, widget: object, fields: *loc }
              - { name: suites, label: Suites, widget: object, fields: *loc }
              - { name: dining, label: Dining, widget: object, fields: *loc }
              - { name: spa, label: Spa, widget: object, fields: *loc }
              - { name: experiences, label: Experiences, widget: object, fields: *loc }
              - { name: events, label: Events, widget: object, fields: *loc }
              - { name: gallery, label: Gallery, widget: object, fields: *loc }
              - { name: location, label: Location, widget: object, fields: *loc }
              - { name: sustainability, label: Sustainability, widget: object, fields: *loc }
              - { name: press, label: Press, widget: object, fields: *loc }
              - { name: journal, label: Journal, widget: object, fields: *loc }
              - { name: contact, label: Contact, widget: object, fields: *loc }
              - { name: legal, label: Legal, widget: object, fields: *loc }
              - { name: impressum, label: Impressum, widget: object, fields: *loc }
              - { name: privacy, label: Privacy, widget: object, fields: *loc }
              - { name: terms, label: Terms, widget: object, fields: *loc }
              - { name: cookies, label: Cookies, widget: object, fields: *loc }
              - { name: menuOpen, label: Menu Open, widget: object, fields: *loc }
              - { name: menuClose, label: Menu Close, widget: object, fields: *loc }
          - name: common
            label: Common Strings
            widget: object
            fields:
              - { name: reserve, label: Reserve, widget: object, fields: *loc }
              - { name: checkAvailability, label: Check Availability, widget: object, fields: *loc }
              - { name: arrival, label: Arrival, widget: object, fields: *loc }
              - { name: departure, label: Departure, widget: object, fields: *loc }
              - { name: adults, label: Adults, widget: object, fields: *loc }
              - { name: children, label: Children, widget: object, fields: *loc }
              - { name: bookTable, label: Book Table, widget: object, fields: *loc }
              - { name: vouchers, label: Vouchers, widget: object, fields: *loc }
              - { name: eventsShop, label: Events Shop, widget: object, fields: *loc }
              - { name: continue, label: Continue, widget: object, fields: *loc }
              - { name: discover, label: Discover, widget: object, fields: *loc }
              - { name: skip, label: Skip, widget: object, fields: *loc }
              - { name: langSwitch, label: Language, widget: object, fields: *loc }
              - { name: phone, label: Phone, widget: object, fields: *loc }
              - { name: email, label: Email, widget: object, fields: *loc }
              - { name: address, label: Address, widget: object, fields: *loc }
              - { name: callUs, label: Call Us, widget: object, fields: *loc }
              - { name: writeUs, label: Write Us, widget: object, fields: *loc }
              - { name: openDaily, label: Open Daily, widget: object, fields: *loc }
              - { name: included, label: Included, widget: object, fields: *loc }
              - { name: faqTitle, label: FAQ Title, widget: object, fields: *loc }
              - { name: trade, label: Trade, widget: object, fields: *loc }
              - { name: gdsNote, label: GDS Note, widget: object, fields: *loc }
              - { name: backTo, label: Back To, widget: object, fields: *loc }
              - { name: photoCredit, label: Photo Credit, widget: object, fields: *loc }
          - name: footer
            label: Footer
            widget: object
            fields:
              - { name: factLine, label: Fact Line, widget: object, fields: *loctext }
              - { name: partOf, label: Part Of, widget: object, fields: *loctext }
              - { name: credentials, label: Credentials, widget: object, fields: *loc }
          - name: consent
            label: Cookie Consent
            widget: object
            fields:
              - { name: title, label: Title, widget: object, fields: *loc }
              - { name: body, label: Body, widget: object, fields: *loctext }
              - { name: acceptAll, label: Accept All, widget: object, fields: *loc }
              - { name: necessaryOnly, label: Necessary Only, widget: object, fields: *loc }
              - { name: settings, label: Settings, widget: object, fields: *loc }
              - { name: save, label: Save, widget: object, fields: *loc }
              - { name: catNecessary, label: Category Necessary, widget: object, fields: *loc }
              - { name: catNecessaryDesc, label: Necessary Desc, widget: object, fields: *loctext }
              - { name: catPreferences, label: Category Preferences, widget: object, fields: *loc }
              - { name: catPreferencesDesc, label: Preferences Desc, widget: object, fields: *loctext }
              - { name: catStatistics, label: Category Statistics, widget: object, fields: *loc }
              - { name: catStatisticsDesc, label: Statistics Desc, widget: object, fields: *loctext }
              - { name: catMarketing, label: Category Marketing, widget: object, fields: *loc }
              - { name: catMarketingDesc, label: Marketing Desc, widget: object, fields: *loctext }
          - name: notFound
            label: 404 Page
            widget: object
            fields:
              - { name: title, label: Title, widget: object, fields: *loc }
              - { name: body, label: Body, widget: object, fields: *loctext }
              - { name: cta, label: CTA, widget: object, fields: *loc }

  # ── 2. HOMEPAGE ──
  - name: homepage
    label: 🏠 Homepage
    files:
      - name: homepage
        label: Homepage Content
        file: src/content/homepage/homepage.json
        fields:
          - name: hero
            label: Hero
            widget: object
            fields:
              - { name: line, label: Line, widget: object, fields: *loctext }
              - { name: tagline, label: Tagline, widget: object, fields: *loc }
              - { name: image, label: Image Key, widget: string, hint: 'Reference key from photos library' }
          - name: sections
            label: Sections
            widget: list
            fields:
              - { name: id, label: Section ID, widget: string }
              - { name: eyebrow, label: Eyebrow, widget: object, fields: *loc, required: false }
              - { name: title, label: Title, widget: object, fields: *loc }
              - { name: body, label: Body Paragraphs, widget: object, fields: *locpars }
              - { name: image, label: Image Key, widget: string }
              - { name: ctaHref, label: CTA Link, widget: string }
              - { name: ctaLabel, label: CTA Label, widget: object, fields: *loc }
              - { name: flip, label: Flip Layout, widget: boolean, default: false }
          - name: trust
            label: Trust Section
            widget: object
            fields:
              - { name: eyebrow, label: Eyebrow, widget: object, fields: *loc }
              - { name: title, label: Title, widget: object, fields: *loc }
              - name: items
                label: Items
                widget: list
                fields:
                  - { name: id, label: ID, widget: string }
                  - { name: text, label: Text, widget: object, fields: *loctext }

  # ── 3. PAGES ──
  - name: pages
    label: 📄 Pages
    folder: src/content/pages
    extension: json
    format: json
    create: true
    summary: '{{fields.slug}}'
    identifier_field: slug
    fields:
      - { name: slug, label: Page Slug, widget: string, hint: 'e.g. suites-index, dining-index, contact, location' }
      - { name: metaTitle, label: Meta Title, widget: object, fields: *loc }
      - { name: metaDesc, label: Meta Description, widget: object, fields: *loctext }
      - { name: h1, label: H1, widget: object, fields: *loc }
      - { name: intro, label: Intro, widget: object, fields: *loctext }
      - { name: body, label: Body Paragraphs, widget: object, fields: *locpars, required: false }

  # ── 4. SUSTAINABILITY ──
  - name: sustainability
    label: 🌿 Sustainability Page
    files:
      - name: sustainability
        label: Sustainability Story
        file: src/content/sustainability/sustainability.json
        fields:
          - name: hero
            label: Hero
            widget: object
            fields:
              - { name: eyebrow, label: Eyebrow, widget: object, fields: *loc }
              - { name: image, label: Image Key, widget: string, hint: 'Reference key from the photos library, for example hotel_041' }
              - { name: caption, label: Image Caption, widget: object, fields: *loc }
              - { name: body, label: Introductory Paragraphs, widget: object, fields: *locpars }
          - name: explorer
            label: Interactive Commitments
            widget: object
            fields:
              - { name: eyebrow, label: Eyebrow, widget: object, fields: *loc }
              - { name: title, label: Title, widget: object, fields: *loc }
              - { name: instruction, label: Instruction, widget: object, fields: *loc }
              - name: items
                label: Commitment Areas
                widget: list
                fields:
                  - { name: id, label: ID, widget: string }
                  - { name: number, label: Number, widget: string, hint: 'Use a two-digit number, for example 01' }
                  - { name: title, label: Title, widget: object, fields: *loc }
                  - { name: summary, label: Summary, widget: object, fields: *loctext }
                  - { name: details, label: Detail Paragraphs, widget: object, fields: *locpars }
                  - { name: image, label: Image Key, widget: string, hint: 'Reference key from the photos library' }
          - name: standards
            label: Standards and Credentials
            widget: object
            fields:
              - { name: eyebrow, label: Eyebrow, widget: object, fields: *loc }
              - { name: title, label: Title, widget: object, fields: *loc }
              - { name: body, label: Introductory Text, widget: object, fields: *loctext }
              - name: points
                label: Credentials
                widget: list
                fields: *loctext
              - name: logos
                label: Accreditation Logos
                widget: list
                fields:
                  - { name: id, label: ID, widget: string, hint: 'Use a stable lowercase identifier, for example swisstainable' }
                  - { name: src, label: Image Path, widget: string, hint: 'Public image path, for example /images/awards/swisstainable.webp' }
                  - { name: alt, label: Accessible Image Description, widget: object, fields: *loc }
          - name: next
            label: Next Steps
            widget: object
            fields:
              - { name: eyebrow, label: Eyebrow, widget: object, fields: *loc }
              - { name: title, label: Title, widget: object, fields: *loc }
              - { name: intro, label: Intro, widget: object, fields: *loctext }
              - name: items
                label: Initiatives
                widget: list
                fields:
                  - { name: title, label: Title, widget: object, fields: *loc }
                  - { name: body, label: Text, widget: object, fields: *loctext }

  # ── 5. SUITES ──
  - name: suites
    label: 🛏️ Suites & Residence
    folder: src/content/suites
    extension: json
    format: json
    create: true
    identifier_field: order
    summary: '{{fields.name.en}}'
    fields:
      - { name: order, label: Order, widget: number }
      - name: name
        label: Name
        widget: object
        fields: *loc
      - { name: sqm, label: Size (m²), widget: number }
      - { name: sleeps, label: Sleeps, widget: number }
      - { name: count, label: Number of units, widget: number }
      - { name: lakeView, label: Lake view, widget: hidden, default: true }
      - { name: terrace, label: Private terrace, widget: hidden, default: true }
      - name: photos
        label: Photos
        widget: list
        fields:
          - { name: src, label: Image URL, widget: string, hint: 'Full URL or /src/assets/photos/... path' }
          - name: alt
            label: 'Alt text (all languages)'
            widget: object
            fields: *loc
      - name: summary
        label: Summary
        widget: object
        fields: *loctext
      - name: body
        label: Body paragraphs
        widget: object
        fields: *locpars
      - name: amenities
        label: Amenities
        widget: list
        fields: *loc

  # ── 5. DINING ──
  - name: dining
    label: 🍽️ Dining venues
    folder: src/content/dining
    extension: json
    format: json
    create: true
    identifier_field: name
    summary: '{{fields.name}}'
    fields:
      - { name: order, label: Order, widget: number }
      - { name: name, label: Venue name, widget: string }
      - { name: kind, label: Kind, widget: select, options: [restaurant, terrace, bar] }
      - name: photos
        label: Photos
        widget: list
        fields:
          - { name: src, label: Image URL, widget: string }
          - name: alt
            label: 'Alt text (all languages)'
            widget: object
            fields: *loc
      - name: summary
        label: Summary
        widget: object
        fields: *loctext
      - name: facts
        label: Facts
        widget: list
        fields: *loc

  # ── 6. SPA ──
  - name: spa
    label: 💆 Spa treatments
    folder: src/content/spa
    extension: json
    format: json
    create: true
    summary: '{{fields.name.en}}'
    fields:
      - { name: order, label: Order, widget: number }
      - name: name
        label: Treatment name
        widget: object
        fields: *loc
      - { name: duration, label: Duration, widget: string, hint: 'e.g. 50 min' }
      - name: summary
        label: Description
        widget: object
        fields: *loctext

  # ── 7. OFFERS ──
  - name: offers
    label: 🎁 Experiences & Offers
    folder: src/content/offers
    extension: json
    format: json
    create: true
    summary: '{{fields.name.en}}'
    fields:
      - { name: order, label: Order, widget: number }
      - name: name
        label: Name
        widget: object
        fields: *loc
      - name: summary
        label: Summary
        widget: object
        fields: *loctext
      - name: body
        label: Body paragraphs
        widget: object
        fields: *locpars
      - name: includes
        label: What it includes
        widget: list
        fields: *loc
      - name: photo
        label: Photo
        widget: object
        fields:
          - { name: src, label: Image URL, widget: string }
          - name: alt
            label: 'Alt text (all languages)'
            widget: object
            fields: *loc

  # ── 8. JOURNAL ──
  - name: journal
    label: 📝 Journal
    folder: src/content/journal
    extension: json
    format: json
    create: true
    summary: '{{fields.title.en}}'
    fields:
      - { name: date, label: Date, widget: string, hint: 'YYYY-MM-DD' }
      - name: title
        label: Title
        widget: object
        fields: *loc
      - name: excerpt
        label: Excerpt
        widget: object
        fields: *loctext
      - name: body
        label: Body paragraphs
        widget: object
        fields: *locpars
      - name: photo
        label: Photo
        widget: object
        fields:
          - { name: src, label: Image URL, widget: string }
          - name: alt
            label: 'Alt text (all languages)'
            widget: object
            fields: *loc

  # ── 9. FAQ ──
  - name: faq
    label: ❓ FAQ
    folder: src/content/faq
    extension: json
    format: json
    create: true
    summary: '{{fields.question.en}}'
    fields:
      - { name: order, label: Order, widget: number }
      - name: question
        label: Question
        widget: object
        fields: *loctext
      - name: answer
        label: Answer
        widget: object
        fields: *loctext

  # ── 10. LEGAL ──
  - name: legal
    label: ⚖️ Legal Pages
    folder: src/content/legal
    extension: json
    format: json
    create: true
    summary: '{{fields.slug}}'
    identifier_field: slug
    fields:
      - { name: slug, label: Slug, widget: string, hint: 'impressum, privacy, terms, cookies' }
      - name: title
        label: Title
        widget: object
        fields: *loc
      - name: body
        label: Body Paragraphs
        widget: object
        fields: *locpars
