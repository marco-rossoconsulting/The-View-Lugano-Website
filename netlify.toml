[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Press pages currently live as ?page_id= on WP. Must precede / → /en/.
[[redirects]]
  from = "/"
  query = {page_id = "92"}
  to = "/it/press/"
  status = 301
  force = true

[[redirects]]
  from = "/en/"
  query = {page_id = "3241"}
  to = "/en/press/"
  status = 301
  force = true

# ── Redirects: canonical paths ──
# (force = true ensures Netlify edge rules override Astro’s generated static files)
[[redirects]]
  from = "/"
  to = "/en/"
  status = 301
  force = true

# Language roots without trailing slash → with trailing slash
[[redirects]]
  from = "/en"
  to = "/en/"
  status = 301

[[redirects]]
  from = "/de"
  to = "/de/"
  status = 301

[[redirects]]
  from = "/it"
  to = "/it/"
  status = 301

[[redirects]]
  from = "/fr"
  to = "/fr/"
  status = 301

# ── Pre-cutover: WordPress path 301s ──
# Map live 200 WP URLs (REST + Rank-named) to the closest Astro locale route.
# Do not change the / → /en/ rule above; homepage language is pending Marco.
# More-specific rules before splats. Skip junk (blog posts, taxonomies, ?p=).

