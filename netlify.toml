[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Cache-control: static assets forever, HTML for 1 hour, images for 1 year
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera()"

# Canonical redirects: www and HTTP to HTTPS non-www
[[redirects]]
  from = "http://www.theviewlugano.com/*"
  to = "https://www.theviewlugano.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.theviewlugano.com/*"
  to = "https://www.theviewlugano.com/:splat"
  status = 301
  force = true
