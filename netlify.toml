[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# ── Redirects: canonical paths ──
# (force = true ensures Netlify edge rules override Astro’s generated static files)
[[redirects]]
  from = "/"
  to = "/en/"
  status = 301
  force = true

# Language roots without trailing slash → with trailing slash
[[redirects]]
  from = "/en"
  to = "/en/"
  status = 301

[[redirects]]
  from = "/de"
  to = "/de/"
  status = 301

[[redirects]]
  from = "/it"
  to = "/it/"
  status = 301

[[redirects]]
  from = "/fr"
  to = "/fr/"
  status = 301

# Apex → www (www is canonical per astro.config.mjs)
[[redirects]]
  from = "http://theviewlugano.com/*"
  to = "https://www.theviewlugano.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://theviewlugano.com/*"
  to = "https://www.theviewlugano.com/:splat"
  status = 301
  force = true

# http → https
[[redirects]]
  from = "http://www.theviewlugano.com/*"
  to = "https://www.theviewlugano.com/:splat"
  status = 301
  force = true

# ── Headers: cache-control ──
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera()"
